events {
    worker_connections 1024;
}

http {
    # UPSTREAMS APONTANDO PARA O HOST (127.0.0.1)
    # Pois o Nginx agora está fora do Docker
    upstream datacount-backend {
        server 127.0.0.1:3000;
    }

    upstream datacount-frontend {
        server 127.0.0.1:5173;
    }

    server {
        listen 80;

        # 1. API DO DATACCOUNT (Obrigatório vir antes para evitar erro de JSON)
        location /datacount/api/ {
            rewrite ^/datacount/api/(.*)$ /api/$1 break;
            proxy_pass http://datacount-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. FRONTEND DO DATACCOUNT
        location /datacount/ {
            proxy_pass http://datacount-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- EXEMPLO PARA OUTRAS APLICAÇÕES (ABATEA) ---
        # location /abatea/api/ {
        #     rewrite ^/abatea/api/(.*)$ /api/$1 break;
        #     proxy_pass http://127.0.0.1:8081;
        # }
        #
        # location /abatea/ {
        #     proxy_pass http://127.0.0.1:80; # Ou a porta que você expuser
        # }

        location = / {
            return 404;
        }
    }
}
